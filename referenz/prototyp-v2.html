<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>nachhilfly Prototyp v2</title>
<style>
/* nachhilfly Design-Tokens (aus DESIGN.md). Nur helles Design. */
:root {
  --nh-blue: #4A5BA6;
  --nh-blue-ink: #2E3B78;
  --nh-blue-tint: #EEF1FA;
  --nh-bg: #FFFFFF;
  --nh-bg-grouped: #F2F3F7;
  --nh-fill: #F2F3F7;
  --nh-fill-strong: #E4E6EC;
  --nh-text: #111827;
  --nh-text-2: #6B7080;
  --nh-text-off: #9A9FAD;
  --nh-sep: #D5D8E0;
  --nh-chip-line: #D5DBEA;
  --nh-ok: #1E6B44;
  --nh-ok-tint: #E3F2E9;
  --nh-wait: #8A5300;
  --nh-wait-tint: #FBF0DD;
  --nh-danger: #B3261E;
  --nh-danger-tint: #FBE9E7;
  --nh-badge: #D93B30;
  --nh-sub-ma: #4A5BA6;
  --nh-sub-en: #B4532A;
  --nh-sub-de: #2F7D5B;
  --nh-sub-bio: #6F4FA0;
  --nh-sub-ph: #0E6F86;
  --nh-sub-ch: #8A4B12;
  --nh-sub-fr: #A23B5B;
  --nh-font: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", system-ui, Roboto, sans-serif;
  --nh-ease: cubic-bezier(.32, .72, 0, 1);
  /* Testumgebung um das Handy herum */
  --stage-bg: #E7E9EF;
  --stage-ink: #2A2F3D;
  color-scheme: light;
}

/* ---------- Testumgebung (nicht Teil der App) ---------- */
html, body { height: 100%; }
body { margin: 0; background: var(--stage-bg); color: var(--stage-ink); font-family: var(--nh-font); -webkit-font-smoothing: antialiased; }
.stage { min-height: 100%; display: flex; gap: 40px; align-items: center; justify-content: center; padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-sizing: border-box; }
.panel { width: 280px; display: flex; flex-direction: column; gap: 14px; }
.panel h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
.panel p { margin: 0; font-size: 14px; line-height: 1.45; color: #545A6B; }
.roles { display: flex; flex-direction: column; gap: 6px; }
.role { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: center; text-align: left; padding: 8px 10px; border: 0; border-radius: 12px; background: transparent; font: inherit; color: inherit; cursor: pointer; }
.role:hover { background: rgba(255,255,255,.6); }
.role[aria-pressed="true"] { background: #FFFFFF; box-shadow: 0 1px 3px rgba(20,30,70,.12); }
.role b { display: block; font-size: 14px; font-weight: 600; }
.role span { font-size: 12.5px; color: #545A6B; }
.role .av { width: 34px; height: 34px; font-size: 12px; }
.reset { align-self: flex-start; border: 0; background: none; font: inherit; font-size: 13px; color: var(--nh-blue-ink); text-decoration: underline; cursor: pointer; padding: 4px 0; }
.mobilebar { display: none; }
.phone { width: 390px; height: 844px; max-height: calc(100vh - 48px); border-radius: 46px; background: #0E1018; padding: 10px; box-shadow: 0 30px 80px rgba(20,30,70,.25); flex: none; }
.screen { position: relative; width: 100%; height: 100%; border-radius: 37px; overflow: hidden; background: var(--nh-bg); color: var(--nh-text); isolation: isolate; }
@media (max-width: 760px) {
  .stage { padding: 0; display: block; }
  .panel { display: none; }
  .phone { width: 100%; height: 100dvh; max-height: none; border-radius: 0; padding: 0; box-shadow: none; }
  .screen { border-radius: 0; }
  .mobilebar { display: flex; position: fixed; z-index: 50; right: 12px; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); }
}

/* ---------- App ---------- */
.screen, .screen button, .screen input, .screen textarea { font-family: var(--nh-font); }
.screen *, .screen *::before, .screen *::after { box-sizing: border-box; }
.screen ::selection { background: #C9D1EE; }
.screen :focus-visible { outline: 2px solid var(--nh-blue); outline-offset: 2px; }
.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.s { width: 16px; height: 16px; }
.ic.xs { width: 14px; height: 14px; }

/* Navigationsleiste oben */
.nb { position: absolute; top: 0; left: 0; right: 0; height: 52px; z-index: 4; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 16px; background: rgba(255,255,255,0); box-shadow: 0 .5px 0 rgba(0,0,0,0); transition: background-color .25s ease-out, box-shadow .25s ease-out; }
.nb.cmp { background: rgba(255,255,255,.86); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); box-shadow: 0 .5px 0 rgba(0,0,0,.18); }
.nb.grey { background: rgba(242,243,247,0); }
.nb.grey.cmp { background: rgba(242,243,247,.86); }
.ctitle { position: absolute; left: 50%; max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transform: translate(-50%, 4px); opacity: 0; font-size: 17px; font-weight: 600; transition: opacity .2s ease-out, transform .35s var(--nh-ease); pointer-events: none; }
.cmp .ctitle { opacity: 1; transform: translate(-50%, 0); }
.logo { width: 34px; height: 28px; border-radius: 6px; background: #FFFFFF; box-shadow: 0 0 0 1px #D9DCE5; color: var(--nh-blue); font-size: 7.5px; font-weight: 700; display: grid; place-items: center; text-align: center; line-height: 1.1; flex: none; overflow: hidden; }
.logo img { width: 100%; height: 100%; object-fit: contain; background: #FFFFFF; }
.logo.has-img { width: 40px; height: 28px; box-shadow: none; }
.nbtn { width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; color: var(--nh-blue); display: grid; place-items: center; cursor: pointer; }
.nbtn:active { background: var(--nh-fill); }
.nb .sp { flex: 1; }
.rolebtn { height: 32px; padding: 0 10px 0 4px; border: 0; border-radius: 16px; background: var(--nh-fill); display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 13px; font-weight: 600; color: var(--nh-text); cursor: pointer; }
.rolebtn .av { width: 24px; height: 24px; font-size: 10px; }

/* Scrollbereich */
.sc { position: absolute; inset: 0; overflow-y: auto; padding: 52px 0 110px; box-sizing: border-box; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.sc::-webkit-scrollbar { display: none; }
.sc.notab { padding-bottom: 40px; }
.sc.grey { background: var(--nh-bg-grouped); }
.lt { margin: 0 16px 4px; font-size: 34px; font-weight: 700; letter-spacing: -.022em; line-height: 41px; text-wrap: balance; }
.lsub { margin: 0 16px 10px; font-size: 15px; color: var(--nh-text-2); line-height: 1.4; }
.sh { margin: 26px 16px 0; padding-bottom: 8px; font-size: 13px; font-weight: 400; color: var(--nh-text-2); border-bottom: .5px solid var(--nh-sep); }
.sh.flat { border-bottom: 0; padding-bottom: 7px; }
.foot { margin: 10px 16px 0; font-size: 13px; color: var(--nh-text-2); line-height: 1.45; }

/* Hinweisband (Ferien, eingeschränkt) */
.note { margin: 6px 16px 4px; padding: 12px 14px; border-radius: 12px; background: var(--nh-blue-tint); color: var(--nh-blue-ink); font-size: 15px; line-height: 1.4; display: flex; gap: 10px; align-items: flex-start; }
.note.wait { background: var(--nh-wait-tint); color: #5E3A00; }
.note.ok { background: var(--nh-ok-tint); color: #154D31; }
.note.danger { background: var(--nh-danger-tint); color: #7A1A14; }
.note b { font-weight: 600; }
.note .ic { margin-top: 1px; }

/* Suche & Filter */
.search { display: flex; align-items: center; gap: 8px; height: 44px; margin: 6px 16px 0; padding: 0 12px; border-radius: 12px; background: var(--nh-fill); color: var(--nh-text-2); }
.search input { border: 0; background: transparent; font-size: 17px; color: var(--nh-text); flex: 1; min-width: 0; outline: none; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px 12px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; padding: 0; }
.chip { height: 34px; padding: 0 13px; border-radius: 17px; border: 0; background: #FFFFFF; box-shadow: inset 0 0 0 1px var(--nh-chip-line); font-size: 15px; color: var(--nh-text); display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; flex: none; cursor: pointer; transition: background-color .2s ease-out, box-shadow .2s ease-out, transform .15s ease-out; }
.chip:active { transform: scale(.96); }
.chip.on { background: var(--nh-blue-tint); box-shadow: inset 0 0 0 1.5px var(--nh-blue); color: var(--nh-blue-ink); font-weight: 600; }
.chip:disabled { color: var(--nh-text-off); cursor: default; }

/* Listenzeile mit Fach-Banner */
.row { width: 100%; display: grid; grid-template-columns: 40px 40px minmax(0, 1fr) auto 14px; gap: 12px; align-items: start; padding: 14px 16px 14px 0; border: 0; background: #FFFFFF; color: inherit; text-align: left; position: relative; cursor: pointer; transition: background-color .15s ease-out; font-size: 17px; }
.row.nochev { grid-template-columns: 40px 40px minmax(0, 1fr) auto; }
.row:active { background: var(--nh-fill); }
.row.static { cursor: default; }
.row.static:active { background: #FFFFFF; }
.row::after { content: ""; position: absolute; left: 104px; right: 0; bottom: 0; height: .5px; background: var(--nh-sep); }
.row.dim { color: var(--nh-text-off); }
.row.dim .ban { opacity: .45; }
.row .t1 { font-size: 17px; font-weight: 600; }
.row .t2 { font-size: 15px; color: var(--nh-text-2); margin-top: 3px; line-height: 1.35; }
.row .t3 { font-size: 15px; margin-top: 4px; line-height: 1.35; }
.row .r1 { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.row .r2 { font-size: 13px; margin-top: 3px; text-align: right; }
.row .chev { color: #B4B8C4; margin-top: 4px; }
.ban { min-height: 64px; align-self: stretch; border-radius: 0 6px 6px 0; color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: flex-start; justify-content: center; padding-top: 10px; box-sizing: border-box; letter-spacing: .02em; }
.av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 15px; flex: none; }
.av.l { width: 76px; height: 76px; font-size: 26px; }
.acts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

/* einfache Zeile (iOS-Liste) */
.it { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 16px; position: relative; font-size: 17px; background: #FFFFFF; }
.it::after { content: ""; position: absolute; left: 16px; right: 0; bottom: 0; height: .5px; background: var(--nh-sep); }
.it .k { flex: 1 1 auto; min-width: min-content; }
.it .v { flex: 0 1 auto; min-width: 0; color: var(--nh-text-2); text-align: right; font-variant-numeric: tabular-nums; }
button.it { width: 100%; border: 0; text-align: left; color: inherit; cursor: pointer; }
button.it:active { background: var(--nh-fill); }
.it.link { color: var(--nh-blue); }
.it.red { color: var(--nh-danger); }
.it.add { padding-left: 116px; color: var(--nh-blue); }

/* Gruppen (in Blättern / grauen Seiten) */
.grp { margin: 0 16px; background: #FFFFFF; border-radius: 12px; overflow: hidden; }
.grp .it:last-child::after, .grp .row:last-child::after { display: none; }
.grp .it::after { left: 16px; }
.grp.pad { padding: 12px 16px; font-size: 17px; line-height: 1.42; }
.gh { margin: 22px 16px 7px 32px; font-size: 13px; font-weight: 400; color: var(--nh-text-2); }
.gf { margin: 7px 32px 0; font-size: 13px; color: var(--nh-text-2); line-height: 1.4; }

/* Knöpfe */
.btn { height: 50px; border: 0; border-radius: 12px; background: var(--nh-blue); color: #FFFFFF; font-size: 17px; font-weight: 600; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; transition: transform .15s ease-out, opacity .15s; }
.btn:active { transform: scale(.97); opacity: .92; }
.btn.sec { background: var(--nh-fill); color: var(--nh-text); }
.btn.red { background: var(--nh-danger-tint); color: var(--nh-danger); }
.btn:disabled { background: var(--nh-fill-strong); color: var(--nh-text-off); cursor: default; transform: none; }
.pb { height: 36px; padding: 0 16px; border: 0; border-radius: 18px; font-size: 15px; font-weight: 600; cursor: pointer; background: var(--nh-blue); color: #FFFFFF; transition: transform .15s ease-out; }
.pb:active { transform: scale(.96); }
.pb.sec { background: var(--nh-fill); color: var(--nh-text); font-weight: 500; }
.pb.red { background: var(--nh-danger-tint); color: var(--nh-danger); }
.pb:disabled { background: var(--nh-fill); color: var(--nh-text-off); cursor: default; }
.tbtn { height: 44px; border: 0; background: transparent; font-size: 17px; color: var(--nh-blue); cursor: pointer; padding: 0 8px; }
.tbtn.b { font-weight: 600; }
.tbtn.grey { color: var(--nh-text-2); font-size: 15px; }
.bwrap { padding: 16px; display: flex; flex-direction: column; gap: 10px; }

/* Status-Pillen */
.pill { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.pill.ok { background: var(--nh-ok-tint); color: var(--nh-ok); }
.pill.wait { background: var(--nh-wait-tint); color: var(--nh-wait); }
.pill.red { background: var(--nh-danger-tint); color: var(--nh-danger); }
.pill.blue { background: var(--nh-blue-tint); color: var(--nh-blue-ink); }
.pill.grey { background: var(--nh-fill-strong); color: #4B5163; }

/* Schalter, Segmente, Häkchen */
.sw { width: 51px; height: 31px; border-radius: 16px; border: 0; padding: 0; background: var(--nh-fill-strong); position: relative; cursor: pointer; transition: background-color .25s ease-out; flex: none; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 6px rgba(0,0,0,.18), 0 0 0 .5px rgba(0,0,0,.04); transition: transform .35s var(--nh-ease); }
.sw[aria-checked="true"] { background: var(--nh-blue); }
.sw[aria-checked="true"]::after { transform: translateX(20px); }
.sg { display: flex; padding: 2px; border-radius: 9px; background: var(--nh-fill-strong); margin: 0 16px; }
.sg button { flex: 1; min-width: 0; height: 32px; border: 0; border-radius: 7px; background: transparent; font-size: 13px; font-weight: 500; color: var(--nh-text); cursor: pointer; transition: background-color .2s ease-out, box-shadow .2s ease-out; white-space: nowrap; }
.sg button[aria-pressed="true"] { background: #FFFFFF; font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 1px 1px rgba(0,0,0,.04); }
.chk { width: 24px; height: 24px; border-radius: 12px; display: grid; place-items: center; flex: none; margin-top: 8px; }
.chk.y { background: var(--nh-ok); color: #FFFFFF; }
.chk.n { box-shadow: inset 0 0 0 1.5px #C9CCD5; }
.cb { width: 26px; height: 26px; border-radius: 13px; border: 0; box-shadow: inset 0 0 0 1.5px #B9BECB; background: #FFFFFF; display: grid; place-items: center; color: #FFFFFF; cursor: pointer; flex: none; transition: background-color .2s ease-out, box-shadow .2s ease-out; }
.cb[aria-checked="true"] { background: var(--nh-blue); box-shadow: none; }
.bar { display: flex; gap: 4px; }
.bar span { width: 20px; height: 7px; border-radius: 4px; background: var(--nh-fill-strong); }
.bar span.f { background: var(--nh-blue); }
.stepper { display: inline-flex; align-items: center; border-radius: 9px; background: var(--nh-fill-strong); }
.stepper button { width: 44px; height: 32px; border: 0; background: transparent; font-size: 20px; color: var(--nh-text); cursor: pointer; }
.stepper button:disabled { color: var(--nh-text-off); }
.stepper span { min-width: 34px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }

/* Eingaben */
.field { margin: 0 16px; background: #FFFFFF; border-radius: 12px; padding: 10px 16px 12px; }
.field textarea, .field input { width: 100%; border: 0; outline: none; resize: none; font-size: 17px; line-height: 1.4; color: var(--nh-text); background: transparent; padding: 0; }
.field .cnt { font-size: 12.5px; color: var(--nh-text-2); text-align: right; margin-top: 4px; font-variant-numeric: tabular-nums; }
.field.err { box-shadow: inset 0 0 0 1.5px var(--nh-danger); }
.err-t { margin: 6px 32px 0; font-size: 13px; color: var(--nh-danger); }

/* Tab-Leiste unten */
.tb { position: absolute; left: 0; right: 0; bottom: 0; height: 82px; z-index: 4; display: flex; background: rgba(249,249,251,.92); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); box-shadow: 0 -.5px 0 rgba(0,0,0,.18); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tb button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10.5px; font-weight: 500; color: var(--nh-text-2); border: 0; background: transparent; padding-top: 8px; position: relative; cursor: pointer; }
.tb button[aria-current="page"] { color: var(--nh-blue); }
.badge { position: absolute; top: 4px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: var(--nh-badge); color: #FFFFFF; font-size: 11px; font-weight: 600; display: grid; place-items: center; }

/* Blatt von unten */
.back { position: absolute; inset: 0; z-index: 10; border: 0; padding: 0; background: rgba(17,24,39,.3); opacity: 0; transition: opacity .35s ease-out; cursor: default; }
.back.open { opacity: 1; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: calc(100% - 44px); z-index: 11; background: var(--nh-bg-grouped); border-radius: 14px 14px 0 0; box-shadow: 0 -10px 34px rgba(20,30,70,.16); transform: translateY(104%); transition: transform .5s var(--nh-ease); display: flex; flex-direction: column; }
.sheet.open { transform: translateY(0); }
.sheet.tall { height: calc(100% - 44px); }
.shd { display: flex; align-items: center; height: 52px; padding: 0 6px; flex: none; }
.shd .ttl { flex: 1; text-align: center; font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.shd .slot { width: 110px; display: flex; }
.shd .slot.r { justify-content: flex-end; }
.sin { flex: 1; overflow-y: auto; padding: 0 0 20px; scrollbar-width: none; }
.sin::-webkit-scrollbar { display: none; }
.sft { padding: 10px 16px calc(22px + env(safe-area-inset-bottom, 0px)); background: var(--nh-bg-grouped); box-shadow: 0 -.5px 0 rgba(0,0,0,.12); display: flex; flex-direction: column; gap: 8px; flex: none; }
.phead { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 16px 18px; text-align: center; }
.phead .n { font-size: 24px; font-weight: 700; letter-spacing: -.015em; margin-top: 8px; }
.phead .s { font-size: 15px; color: var(--nh-text-2); }

/* Pull-down-Menü */
.catch { position: absolute; inset: 0; z-index: 20; border: 0; padding: 0; background: transparent; cursor: default; }
.menu { position: absolute; z-index: 21; width: 240px; max-height: 420px; overflow-y: auto; border-radius: 13px; background: rgba(250,250,252,.95); -webkit-backdrop-filter: saturate(180%) blur(24px); backdrop-filter: saturate(180%) blur(24px); box-shadow: 0 10px 40px rgba(20,30,70,.2), 0 0 0 .5px rgba(0,0,0,.12); transform-origin: top left; transform: scale(.88); opacity: 0; transition: transform .32s var(--nh-ease), opacity .18s ease-out; }
.menu.r { transform-origin: top right; }
.menu.open { transform: scale(1); opacity: 1; }
.mi { width: 100%; min-height: 44px; display: grid; grid-template-columns: 22px 1fr; align-items: center; gap: 8px; padding: 0 14px 0 12px; border: 0; background: transparent; font-size: 17px; color: var(--nh-text); text-align: left; position: relative; cursor: pointer; }
.mi:active { background: rgba(0,0,0,.06); }
.mi + .mi::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: .5px; background: rgba(0,0,0,.14); }
.mi .chkm { color: var(--nh-blue); display: grid; place-items: center; }

/* Toast */
.toast { position: absolute; left: 16px; right: 16px; bottom: 96px; z-index: 30; padding: 12px 14px; border-radius: 14px; background: rgba(28,32,44,.94); color: #FFFFFF; font-size: 15px; line-height: 1.35; display: flex; gap: 10px; align-items: center; box-shadow: 0 8px 30px rgba(10,15,30,.25); transform: translateY(14px); opacity: 0; transition: transform .4s var(--nh-ease), opacity .25s ease-out; pointer-events: none; }
.toast.open { transform: none; opacity: 1; }
.toast.notab { bottom: 28px; }
.spin { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); border-top-color: #FFFFFF; animation: spin .8s linear infinite; flex: none; }
.spin.dark { border-color: rgba(74,91,166,.25); border-top-color: var(--nh-blue); }
@keyframes spin { to { transform: rotate(360deg); } }

/* Leere Zustände, Schritte */
.empty { padding: 36px 28px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.empty .e1 { font-size: 17px; font-weight: 600; }

  };
  A.actions.pickSlot = function (el) { A.state.form.slot = el.dataset.v; A.render(); };
  A.actions.schedule = function (el) { A.send('schedule', { id: el.dataset.id, slot: A.state.form.slot }, 'Gespräch vereinbart. Die Einladung geht raus.', function () { A.state.sheet = null; }); };
  A.actions.approve = function (el) { A.send('approve', { id: el.dataset.id }, 'Bestätigt. Der Steckbrief ist jetzt sichtbar.', function () { A.state.sheet = null; }); };
  A.actions.reject = function (el) {
    if (!(A.state.form.rej || '').trim()) { A.toast('Bitte schreib einen Grund. Er ist Pflicht.', { icon: 'info' }); var f = document.getElementById('rejText'); if (f) { f.closest('.field').classList.add('err'); f.focus(); } return; }
    A.send('reject', { id: el.dataset.id, reason: A.state.form.rej }, 'Abgelehnt. Die Nachricht mit Grund geht raus.', function () { A.state.sheet = null; });
  };
  A.actions.befangen = function (el) { A.send('befangen', { id: el.dataset.id }, 'Notiert. Jemand anderes übernimmt.'); };
  A.actions.openGuide = function () { A.openSheet('guide'); };
  A.sheets.guide = function () {
    var K = ['Kann eine Aufgabe aus dem eigenen Fach verständlich erklären (kurze Probe im Gespräch).', 'Hat Regeln und Verhaltenskodex verstanden.', 'Ist zuverlässig erreichbar und kennt den Aufwand.', 'Noten werden nicht abgefragt.'];
    var L = ['Begrüßen, kurz erklären, wie das Gespräch läuft (1 Min).', 'Warum willst du Nachhilfe geben? (2 Min)', 'Erklär-Probe: eine Aufgabe für Klasse 6 (4 Min).', 'Regeln kurz durchgehen, Fragen klären (2 Min).', 'Sagen, wann die Entscheidung kommt (1 Min).'];
    return { title: 'Leitfaden', left: '', right: '<button class="tbtn b"' + act('closeSheet') + '>Fertig</button>', body: '<h3 class="gh" style="margin-top:8px">Kriterien (Vorschlag)</h3><div class="kodex"><ul>' + K.map(function (k) { return '<li>' + esc(k) + '</li>'; }).join('') + '</ul></div><h3 class="gh">Ablauf, 10 Minuten</h3><div class="kodex"><ul>' + L.map(function (k) { return '<li>' + esc(k) + '</li>'; }).join('') + '</ul></div><p class="gf">Bei vielen Bewerbungen: Gruppengespräche mit 4 bis 5 Personen.</p>' };
  };

  function tutorStatePill(t) {
    if (t.state === 'ausgesetzt') return U.pill('ausgesetzt', 'red');
    if (t.state === 'pausiert') return U.pill('pausiert', 'grey');
    if (S.used(t.id) >= t.cap) return U.pill('voll', 'blue');
    return U.pill('aktiv', 'ok');
  }
  function tutors() {
    var h = '<p class="lsub">' + db().tutors.length + ' Tutoren. Daten von Nachhilfe-Nehmenden siehst du hier nicht.</p>';
    h += db().tutors.map(function (t) {
      var tu = S.user(t.id);
      return '<button class="row"' + act('openTAdmin', { id: t.id }) + '>' + U.ban(t.s) + U.av(tu) + '<div style="min-width:0"><div class="t1">' + esc(tu.name) + '</div><div class="t2">' + esc(U.kl(tu.klasse)) + ' · ' + S.used(t.id) + ' von ' + t.cap + ' Plätzen</div><div class="t2" style="margin-top:2px">' + String(t.hours).replace('.', ',') + ' bestätigte Stunden' + (t.pendingChange ? ' · Änderung wartet' : '') + '</div></div><div>' + tutorStatePill(t) + '</div>' + U.ic('right', 'xs chev') + '</button>';
    }).join('');
    return { title: 'Tutoren', html: h };
  }
  A.actions.openTAdmin = function (el) { A.openSheet('tadmin', { id: el.dataset.id }); };
  A.sheets.tadmin = function (d, u) {
    var t = S.tutor(d.id), tu = S.user(d.id), self = d.id === u.id, votes = t.banVotes || [];
    var h = '<div class="phead">' + U.av(tu, 'l') + '<div class="n">' + esc(tu.name) + '</div><div class="s">' + esc(U.kl(tu.klasse)) + ' · ' + tutorStatePill(t) + '</div></div>';
    h += '<div class="grp"><div class="it"><span class="k">Plätze</span><span class="v">' + S.used(t.id) + ' von ' + t.cap + '</span></div><div class="it"><span class="k">Bestätigte Stunden</span><span class="v">' + String(t.hours).replace('.', ',') + '</span></div><div class="it"><span class="k">Abzeichen</span><span class="v">' + esc(t.badges.join(', ') || 'keine') + '</span></div></div>';
    if (self) { h += '<div style="margin-top:14px">' + U.note('Das bist du. Entscheidungen über dich trifft jemand anderes.', '', 'lock') + '</div>'; }
    else {
      if (t.pendingChange) h += '<h3 class="gh">Änderung wartet auf Freigabe</h3><div class="grp pad">' + esc(t.pendingChange.bio || '') + '</div><div class="bwrap" style="padding-bottom:0"><button class="btn sec"' + act('approveChange', { id: t.id }) + '>Änderung freigeben</button></div>';
      h += '<h3 class="gh">Abzeichen vergeben</h3><div class="chips wrap" style="margin:0 16px">' + ['10 Stunden geholfen', 'Methoden-Profi', 'Super erklärt'].map(function (b) { return U.chip(esc(b), t.badges.indexOf(b) >= 0, act('badge', { id: t.id, v: b }), t.badges.indexOf(b) >= 0 ? ' disabled' : ''); }).join('') + '</div>';
      h += '<h3 class="gh">Maßnahmen</h3><div class="grp">' +
        (t.state === 'ausgesetzt' ? '<button class="it link"' + act('unsuspend', { id: t.id }) + '>Wieder freigeben</button>' : '<button class="it red"' + act('suspend', { id: t.id }) + '>Vorläufig aussetzen</button>') +
        '<button class="it red"' + act('banReq', { id: t.id }) + (votes.indexOf(u.id) >= 0 ? ' disabled' : '') + '>Sperre beantragen' + (votes.length ? ' · ' + votes.length + ' von 2' : '') + '</button></div>' +
        '<p class="gf">Aussetzen wirkt sofort und beendet laufende Nachhilfen mit dem Hinweis „Tutor nicht mehr verfügbar“, ohne Grund. Eine Sperre braucht ein zweites Mitglied oder die Lehrkraft. Frau Keller wird immer informiert.</p>';
    }
    return { title: 'Tutor', tall: true, left: '', right: '<button class="tbtn b"' + act('closeSheet') + '>Fertig</button>', body: h };
  };
  A.actions.approveChange = function (el) { A.send('approveChange', { id: el.dataset.id }, 'Änderung freigegeben'); };
  A.actions.badge = function (el) { A.send('badge', { id: el.dataset.id, badge: el.dataset.v }, 'Abzeichen vergeben'); };
  A.actions.suspend = function (el) { A.send('suspend', { id: el.dataset.id }, 'Vorläufig ausgesetzt. Frau Keller ist informiert.'); };
  A.actions.unsuspend = function (el) { A.send('unsuspend', { id: el.dataset.id }, 'Freigegeben. Startet pausiert.'); };
  A.actions.banReq = function (el) { A.send('banRequest', { id: el.dataset.id }, 'Sperre beantragt. Ein zweites Mitglied muss zustimmen.'); };

  function reportRow(r, showReporter) {
    var au = S.user(r.aboutId);
    return '<button class="row' + (r.state !== 'offen' ? ' dim' : '') + '"' + act('openRep', { id: r.id }) + '><div class="ban" style="background:' + (r.about === 'tutor' ? 'var(--nh-blue)' : '#6B7080') + '">' + (r.about === 'tutor' ? 'Tu' : 'Ne') + '</div>' + U.av(au) + '<div style="min-width:0"><div class="t1">' + esc(r.grund) + '</div><div class="t2">über ' + esc(au.name) + ' · ' + esc(r.when) + '</div>' + (showReporter ? '<div class="t2" style="margin-top:2px">von ' + esc(r.reporter) + '</div>' : '') + '</div><div>' + (r.state === 'offen' ? U.pill('offen', 'wait') : U.pill(r.decision, 'grey')) + '</div>' + U.ic('right', 'xs chev') + '</button>';
  }
  function reports() {
    var l = db().reports.filter(function (r) { return r.about === 'tutor'; });
    var h = U.note('Hier stehen nur Meldungen über Tutoren, ohne Namen der meldenden Person. Kinderschutz-Meldungen und Meldungen über Nehmende sieht nur Frau Keller.', '', 'shield');
    h += l.length ? '<h2 class="sh">' + l.length + (l.length === 1 ? ' Meldung' : ' Meldungen') + '</h2>' + l.map(function (r) { return reportRow(r, false); }).join('') : U.empty('Alles erledigt', 'Keine Meldungen.');
    return { title: 'Meldungen', html: h };
  }
  A.actions.openRep = function (el) { A.openSheet('rep', { id: el.dataset.id }); };
  A.sheets.rep = function (d, u) {
    var r = db().reports.find(function (x) { return x.id === d.id; }), au = S.user(r.aboutId), teacher = A.view() === 'lehrkraft';
    var h = '<div class="grp" style="margin-top:8px"><div class="it"><span class="k">Über</span><span class="v">' + esc(au.name) + '</span></div><div class="it"><span class="k">Grund</span><span class="v">' + esc(r.grund) + '</span></div><div class="it"><span class="k">Eingegangen</span><span class="v">' + esc(r.when) + '</span></div>' + (teacher ? '<div class="it"><span class="k">Gemeldet von</span><span class="v">' + esc(r.reporter) + '</span></div>' : '') + '</div><h3 class="gh">Beschreibung</h3><div class="grp pad">' + esc(r.text) + '</div>';
    if (r.aboutId === u.id) h += '<div style="margin-top:14px">' + U.note('Die Meldung betrifft dich. Jemand anderes entscheidet.', '', 'lock') + '</div>';
    else if (r.state === 'offen') h += '<h3 class="gh">Entscheidung</h3><div class="grp">' + ['kein Verstoß', 'verwarnt', 'ausgesetzt'].map(function (x) { return '<button class="it' + (x === 'ausgesetzt' ? ' red' : ' link') + '"' + act('decideRep', { id: r.id, v: x }) + '>' + { 'kein Verstoß': 'Kein Verstoß', verwarnt: 'Verwarnen', ausgesetzt: 'Vorläufig aussetzen' }[x] + '</button>'; }).join('') + (teacher ? '' : '<button class="it link"' + act('decideRep', { id: r.id, v: 'an Lehrkraft' }) + '>An Frau Keller abgeben</button>') + '</div><p class="gf">Jede Entscheidung steht im Protokoll.</p>';
    else h += '<p class="gf" style="margin-top:12px">Erledigt: ' + esc(r.decision) + '.</p>';
    return { title: 'Meldung', left: '', right: '<button class="tbtn b"' + act('closeSheet') + '>Fertig</button>', body: h, tall: true };
  };
  A.actions.decideRep = function (el) { A.send('reportDecide', { id: el.dataset.id, decision: el.dataset.v }, 'Entschieden: ' + el.dataset.v, function () { A.state.sheet = null; }); };

  function stats() {
    var T = db().tutors, N = db().nachhilfen;
    var active = T.filter(function (t) { return t.state === 'aktiv'; });
    var freeAll = active.reduce(function (s, t) { return s + Math.max(0, t.cap - S.used(t.id)); }, 0);
    var hours = T.reduce(function (s, t) { return s + t.hours; }, 0);
    var per = Object.keys(NH.SUBJECTS).map(function (c) { return [c, active.filter(function (t) { return t.subjects.indexOf(c) >= 0; }).reduce(function (s, t) { return s + Math.max(0, t.cap - S.used(t.id)); }, 0)]; });
    var max = Math.max.apply(null, per.map(function (p) { return p[1]; }).concat([1]));
    var h = '<p class="lsub">Nur Zahlen, keine Namen. Beispieldaten.</p><div class="grp">' +
      it('Aktive Tutoren', active.length) + it('Freie Plätze', freeAll) + it('Offene Anfragen', N.filter(function (x) { return x.state === 'offen'; }).length) + it('Laufende Nachhilfen', N.filter(function (x) { return x.state === 'laeuft' || x.state === 'probe'; }).length) + it('Bestätigte Stunden', String(hours).replace('.', ',')) + '</div>';
    h += '<h3 class="gh">Freie Plätze je Fach</h3><div class="grp" style="padding:8px 16px">' + per.map(function (p) {
      return '<div style="display:grid;grid-template-columns:96px 1fr 28px;gap:10px;align-items:center;min-height:32px"><span style="font-size:15px">' + esc(NH.SUBJECTS[p[0]].name) + '</span><span style="height:10px;border-radius:5px;background:var(--nh-fill)"><span style="display:block;height:100%;border-radius:5px;width:' + (p[1] / max * 100) + '%;background:' + NH.SUBJECTS[p[0]].color + '"></span></span><span style="font-size:15px;text-align:right;font-variant-numeric:tabular-nums;color:' + (p[1] ? 'var(--nh-text)' : 'var(--nh-danger)') + '">' + p[1] + '</span></div>';
    }).join('') + '</div><p class="gf">Rot heißt: in diesem Fach gerade kein freier Platz. Gezielt Tutoren suchen.</p>';
    return { title: 'Zahlen', html: h, grey: true };
  }
  function it(k, v) { return '<div class="it"><span class="k">' + esc(k) + '</span><span class="v">' + esc(v) + '</span></div>'; }

  /* ---------- Lehrkraft ---------- */
  A.areas.lehrkraft = {
    tabs: function () {
      var c = db().consents.filter(function (x) { return x.state === 'wartet'; }).length;
      var r = db().reports.filter(function (x) { return x.state === 'offen'; }).length;
      return [{ id: 'consent', label: 'Einwilligungen', icon: 'lock', badge: c || '' }, { id: 'reports', label: 'Meldungen', icon: 'flag', badge: r || '' }, { id: 'log', label: 'Protokoll', icon: 'list' }, { id: 'settings', label: 'Einstellungen', icon: 'gear' }];
    },
    screen: function (tab, u) { return { consent: consent, reports: tReports, log: protocol, settings: settings }[tab](u); }
  };
  function consent() {
    var w = db().consents.filter(function (x) { return x.state === 'wartet'; }), d = db().consents.filter(function (x) { return x.state !== 'wartet'; });
    var h = '<p class="lsub">Klasse 5 bis 8. Erst wenn die Einwilligung der Eltern da ist, können sie anfragen.</p>';
    h += w.length ? '<h2 class="sh">Wartet · ' + w.length + '</h2>' + w.map(function (c) { var cu = S.user(c.user); return '<div class="row static nochev"><div class="ban" style="background:#6B7080">' + esc(String(cu.klasse)) + '</div>' + U.av(cu) + '<div style="min-width:0"><div class="t1">' + esc(cu.name) + '</div><div class="t2">' + esc(U.kl(cu.klasse)) + ' · Formular verschickt</div><div class="acts"><button class="pb"' + act('openConsent', { user: c.user }) + '>Liegt vor</button></div></div><span></span></div>'; }).join('') : U.empty('Alles eingetragen', 'Keine offenen Einwilligungen.');
    if (d.length) h += '<h2 class="sh">Eingetragen</h2>' + d.map(function (c) { var cu = S.user(c.user); return '<div class="row static nochev dim"><div class="ban" style="background:#6B7080">' + esc(String(cu.klasse)) + '</div>' + U.av(cu) + '<div style="min-width:0"><div class="t1">' + esc(cu.name) + '</div><div class="t2">' + esc(c.date || '') + ' · online ' + (c.online ? 'erlaubt' : 'nicht erlaubt') + '</div></div><span></span></div>'; }).join('');
    return { title: 'Einwilligungen', html: h };
  }
  A.actions.openConsent = function (el) { A.state.form.cons = { user: el.dataset.user, online: false }; A.openSheet('consent'); };
  A.sheets.consent = function () {
    var C = A.state.form.cons, cu = S.user(C.user);
    return { title: 'Einwilligung', body: '<div class="grp" style="margin-top:8px"><div class="it"><span class="k">Schüler/in</span><span class="v">' + esc(cu.name) + '</span></div><div class="it"><span class="k">Datum</span><span class="v">' + esc(db().today) + '</span></div><div class="it"><span class="k">Online-Nachhilfe erlaubt</span>' + U.sw(C.online, act('consOnline'), 'Online erlaubt') + '</div></div><p class="gf">Wie auf dem Formular angekreuzt. Für Klasse 5 und 6 ist online nur mit diesem Häkchen möglich. Das Papierformular bleibt in der Schule.</p>', footer: '<button class="btn"' + act('saveConsent') + '>Eintragen</button>' };
  };
  A.actions.consOnline = function () { A.state.form.cons.online = !A.state.form.cons.online; A.render(); };
  A.actions.saveConsent = function () { var C = A.state.form.cons; A.send('consent', { user: C.user, online: C.online }, 'Eingetragen. ' + S.user(C.user).first + ' kann jetzt anfragen.', function () { A.state.sheet = null; }); };
  function tReports() {
    var l = db().reports;
    var h = U.note('Kinderschutz-Meldungen kommen direkt per Mail zu Ihnen und werden in der App nicht gespeichert.', '', 'shield');
    h += l.length ? '<h2 class="sh">Alle Meldungen</h2>' + l.map(function (r) { return reportRow(r, true); }).join('') : U.empty('Alles erledigt', 'Keine Meldungen.');
    return { title: 'Meldungen', html: h };
  }
  function protocol() {
    var h = '<p class="lsub">Jede Entscheidung mit Person und Zeit. Wöchentlich als Bericht per Mail.</p><div class="grp">' + db().protocol.map(function (p) {
      return '<div class="it" style="align-items:flex-start;padding-top:10px;padding-bottom:10px"><div class="k"><div style="font-size:15px">' + esc(p.what) + '</div><div style="font-size:13px;color:var(--nh-text-2);margin-top:2px">' + esc(p.who) + ' · ' + esc(p.when) + '</div></div></div>';
    }).join('') + '</div>';
    return { title: 'Protokoll', html: h, grey: true };
  }
  function settings() {
    var s = db().settings;
    var h = '<h3 class="gh" style="margin-top:6px">Zeiten</h3><div class="grp"><div class="it"><span class="k">Ferienmodus</span>' + U.sw(s.ferien, act('setting', { k: 'ferien', l: 'Ferienmodus' }), 'Ferienmodus') + '</div><div class="it"><span class="k">Antwortfrist</span><span class="stepper"><button' + act('frist', { d: -1 }) + (s.frist <= 2 ? ' disabled' : '') + ' aria-label="weniger">−</button><span>' + s.frist + '</span><button' + act('frist', { d: 1 }) + (s.frist >= 5 ? ' disabled' : '') + ' aria-label="mehr">+</button></span></div><div class="it"><span class="k">Online-Nachhilfe bis</span><span class="v">' + s.onlineBis + ' Uhr</span></div></div><p class="gf">Im Ferienmodus laufen keine Fristen. Die Antwortfrist zählt in Schultagen.</p>';
    h += '<h3 class="gh">Not-Aus</h3><div class="grp"><div class="it"><span class="k">App pausieren</span>' + U.sw(s.pause, act('setting', { k: 'pause', l: 'App pausiert' }), 'App pausieren') + '</div></div><p class="gf">Alle anderen sehen dann nur „nachhilfly macht gerade Pause“. Probieren Sie es aus und wechseln Sie die Rolle.</p>';
    h += '<h3 class="gh">Leitungsteam</h3><div class="grp">' + db().leitung.map(function (x) { return it(db().leitungNames[x], 'Vertraulichkeit unterschrieben'); }).join('') + '</div>';
    return { title: 'Einstellungen', html: h, grey: true };
  }
  A.actions.setting = function (el) { var k = el.dataset.k; A.send('setting', { key: k, value: !db().settings[k], label: el.dataset.l + (db().settings[k] ? ' aus' : ' an') }, null, null, true); };
  A.actions.frist = function (el) { var s = db().settings; A.send('setting', { key: 'frist', value: Math.max(2, Math.min(5, s.frist + Number(el.dataset.d))), label: 'Antwortfrist' }, null, null, true); };
})();

/* js/start.js */
/* Startet den Prototyp, sobald alles geladen ist. */
NH.app.start();

</script>

</body></html>
